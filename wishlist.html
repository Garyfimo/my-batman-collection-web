<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist — Gary's Batman Collection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <header class="header">
    <h1>🦇 Gary's Batman Collection</h1>
    <nav class="nav-tabs">
      <a href="index.html">Collection</a>
      <a href="wishlist.html" aria-current="page">Wishlist</a>
    </nav>
    <div class="claimer-header" id="claimer-header"></div>
  </header>

  <main>
    <ul class="wish-list" id="wish-list"></ul>
    <p class="empty" id="wish-empty" hidden>Wishlist is empty.</p>
    <p class="error" id="wish-error" hidden>Couldn't load the wishlist. Try refreshing.</p>
  </main>

  <dialog id="claim-modal" class="modal">
    <div class="modal-field">
      <label for="claim-name-input">Your name</label>
      <input type="text" id="claim-name-input" maxlength="60" autocomplete="name">
    </div>
    <p class="error modal-error" id="claim-error" hidden></p>
    <div class="modal-actions">
      <button type="button" id="claim-cancel">Cancel</button>
      <button type="button" id="claim-confirm">Confirm claim</button>
    </div>
  </dialog>

  <script type="module" src="js/wishlist.js"></script>
</body>
</html>
